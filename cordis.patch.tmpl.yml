# dsh-agent-teams v1 bundle patch — GENERATED FILE.
# Source of truth: prompts/*.md (persona text) + cordis.patch.tmpl.yml (structure).
# Regenerate with:  python3 scripts/build_patch.py
#
# Inserts the BMad squad agent presets on top of the built-in Agent Teams mechanism
# (the base bundle already mounts @deepseek-ai/dsh-agent-team + @deepseek-ai/dsh-tool-agent-team,
# so shared task-board tools reach every agent once the root Session enables Team mode):
#   - bmad-squad-lead : routes/delegates only (no implementation)
#   - bmad-analyst/-pm/-po/-ux/-architect/-dev/-tea : named specialist members
# Delegation uses one @deepseek-ai/dsh-tool-subagent row per member (agentPreset is fixed per row).
# Preset rows cannot be hidden from the picker, so names/descriptions say "供小队使用".

- insert:
    # ============================ Leader ============================
    - id: preset-bmad-squad-lead
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: bmad-squad-lead
        name: BMad 小队 · 调度
        description: BMad 小队的负责人，只做路由与委派、不亲自实现。供小队会话使用。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                @@PROMPT:squad-lead@@
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 委派：一成员一个 subagent 工具（agentPreset 固定在该行），放进 delegation 组与出厂预设一致
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: delegate-analyst
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_analyst
                  agentPreset: bmad-analyst
              - id: delegate-pm
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_pm
                  agentPreset: bmad-pm
              - id: delegate-po
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_po
                  agentPreset: bmad-po
              - id: delegate-ux
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_ux
                  agentPreset: bmad-ux
              - id: delegate-architect
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_architect
                  agentPreset: bmad-architect
              - id: delegate-dev
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_dev
                  agentPreset: bmad-dev
              - id: delegate-tea
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_tea
                  agentPreset: bmad-tea
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    # ============================ Analyst / Mary ============================
