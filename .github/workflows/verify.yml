name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # verify.mjs now runs the deterministic layer end-to-end: it executes each of the 6
      # capability modules' run_evals.mjs (cap-debugging/code-review/task-coordination/
      # security/testing) and every capability-router validate_selection fixture, in addition
      # to the patch/preset/delegation/bundled-skill/frontmatter/category-coverage checks.
      # So this single step covering verify.mjs keeps all 6 modules' evals in CI on every push/PR.
      - name: Verify bundle (patch in sync, presets, delegation, bundled skills, metadata, 6-module deterministic evals)
        run: node scripts/verify.mjs
