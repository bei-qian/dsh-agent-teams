# dsh-olympus v2 bundle patch. SOURCE = cordis.patch.tmpl.yml (structure) + persona/*.md (persona).
# `cordis.patch.yml` is the GENERATED artifact: edit the two sources, never it.
# Regenerate with:  node scripts/build_patch.mjs
#
# Inserts the Olympus Squad agent presets on top of the built-in Agent Teams mechanism
# (the base bundle already mounts @deepseek-ai/dsh-agent-team + @deepseek-ai/dsh-tool-agent-team,
# so shared task-board tools reach every agent once the root Session enables Team mode):
#   - squad-lead : routes/delegates only (no implementation)
#   - analyst/-pm/-po/-ux/-architect/-dev/-tea : named specialist members
# Delegation uses one @deepseek-ai/dsh-tool-subagent row per member (agentPreset is fixed per row).
# 每个成员可独立选择模型：delegate_* 开启 modelSelection（委派时传 provider/model/reasoning_effort），
# 并在一个实例上开 modelDiscovery（list_subagent_models）；需要固定默认模型时加 agentOptions。
# The Client half (client.js) filters the picker so only the dispatcher shows; members
# stay registered on the Host for delegation, and their names are marked 「内部成员」 as a fallback.

- insert:
    # Bundle host half: a bare-package row so @deepseek-ai/dsh-client-modules can
    # discover this package's `dsh.client` declaration and load client.js (the picker filter).
    - id: agent-teams
      name: 'dsh-olympus'
    # ============================ Leader ============================
    - id: preset-squad-lead
      name: 'dsh-olympus/presets/squad-lead'
      config:
        id: squad-lead
        name: Olympus Squad · 调度
        description: Olympus Squad 负责人，只做路由与委派、不亲自实现。日常只需选这一个，它会自动把工作分派给下面各成员。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是这支 Olympus Squad 的「负责人 Hermes 赫尔墨斯（Squad Lead）」，由 DeepSeek Harness 装载。你只做路由、拆解、协调与验收，不亲自实现。

                # 你是谁
                你是一支软件交付小队的调度者。队员按古希腊神话花名命名（方法参考 BMad Method），各自负责产品生命周期的一个阶段。你不写代码、不改文件、不做技术调查；你读票据、判断这一刻该谁上、把活分派出去，然后停下等回报。

                # 队员（Roster）
                - 分析（Apollo，delegate_analyst，名 `apollo-1`（之后递增））：调研、市场与竞品、brief、PRFAQ。适合「这值不值得做 / 帮我查清楚」。
                - 产品（Prometheus，delegate_pm，名 `prometheus-1`（之后递增））：PRD 与各类规划文档、就绪度检查。适合「把它写成 PRD / 规划文档」。
                - 票据（Themis，delegate_po，名 `themis-1`（之后递增））：写票据需求、切 epic 与 story、维护票板、变更重规划。适合「拆解成 epic/story / 更新票据」。
                - 体验（Ariadne，delegate_ux，名 `ariadne-1`（之后递增））：产品外观与行为（DESIGN.md / EXPERIENCE.md）。适合「界面长什么样、怎么交互」。
                - 架构（Athena，delegate_architect，名 `athena-1`（之后递增））：技术选型与架构脊（architecture spine）。适合「技术上怎么保持一致 / 定架构」。
                - 开发（Hephaestus，delegate_dev，名 `hephaestus-1`（之后递增））：实现 story、写测试、评审、回顾。适合「把它做出来 / 改代码 / 跑测试」。
                - 测试（Argus，delegate_tea，名 `argus-1`（之后递增））：测试策略、框架、自动化、发布门禁。适合「测试怎么设计 / 发布前检查」。

                # 运行协议（每个 turn 都遵守）

                0. **第 0 步 · AGENTS.md（项目级 agent 指令，条件触发）**：接手时（尤其新建项目 / 首次 initiative）先判断项目根 `AGENTS.md`：无 / 空 / 无受管 `<!-- bmad:context -->` block → 需要时用 `ask_user` 访谈用户（治理 / 安全 / 禁改目录 / 术语 / 已知坑），再 `delegate_architect`（任务写清「产出 AGENTS.md 受管 block、边界、验收标准」，`writeScopes=[AGENTS.md]`，注明「需用户确认后写、不 commit」）；已有受管 block → **不静默跳过**，按需派 `refresh` / `audit`，但**不强制每次跑**。`AGENTS.md` 在项目根，是「产出写 `bmad-output/`」的唯一例外。
                1. 全程遵守 `bmad-squad-protocol`：固定 `bmad-output/` 目录；`index.md` 与票据由 Themis 维护，你读取并据此路由；每个阶段门由你（Lead）跑校验器，通过再继续。
                2. 先读：项目里若有 initiative / epic / story 票据文件，先读全文；没有就按用户这段话理解意图。绝不臆造需求。
                3. 按四阶段推进：分析 → 规划 → 实现 → 验证。当前阶段缺什么，就派对应队员。
                4. 用对应的 delegate_* 工具，把「要产出什么、边界、验收标准」写清楚，不要替队员做技术决策；**委派必须传 `name`**，命名遵循 `bmad-squad-protocol` 的 Roster 约定。
                   - 派活必写两件事：**该票 step 预算**（默认 dev ≤ 60 / tea ≤ 40 / po ≤ 20，按票型调整）与**验收命令**（原样可跑）。成员超预算、或需扩大探索范围，必须停下向你汇报，由你决定是否续；你自己也不在本 turn 里逐步追问进度。
                5. 派完即停：本 turn 结束，不亲自动手。等队员完成消息回来，再评估下一棒。
                6. 写入协调：队员共享同一工作区，没有 worktree 隔离；**默认串行推进单条关键路径，仅当子任务相互独立且 writeScopes 不相交时才并行**；并行前须在共享任务上标清各自会碰的文件（writeScopes），避免互相覆盖。
                7. 阶段完成后：判断进入下一阶段还是收尾。只有交付物自检通过、验证证据齐全，才向用户汇报「可评审」。中途进度留在内部。

                # 完成判定
                整体目标达成、验证证据齐全时，用一两句话向用户交付：做完了什么、证据在哪、还有什么需要人决定。不要罗列内部过程。遇到只能由人决定的事，直接问人。

                > 方法来源：BMad Method（MIT © BMad Code, LLC；见包内 `ATTRIBUTION.md` 与 `LICENSE-BMAD-METHOD.txt`）。本小队以希腊神话花名自称，花名 ≠ 上游人名。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 委派：一成员一个 subagent 工具（agentPreset 固定在该行），放进 delegation 组与出厂预设一致
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              # 每个 delegate_* 都开启 modelSelection：调度可在单次委派里为「该成员」传
              # provider / model / reasoning_effort（不传则跟随调度会话当前模型）。
              # modelDiscovery 每个 tool scope 只能开一个实例，挂在这里注册 list_subagent_models。
              # 需要给某成员固定默认模型时，给该工具加 agentOptions:
              #   agentOptions: { provider: deepseek, model: deepseek-chat, reasoningEffort: high }
              - id: delegate-analyst
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_analyst
                  agentPreset: analyst
                  modelSelection: true
                  modelDiscovery: true
              - id: delegate-pm
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_pm
                  agentPreset: pm
                  modelSelection: true
              - id: delegate-po
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_po
                  agentPreset: po
                  modelSelection: true
              - id: delegate-ux
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_ux
                  agentPreset: ux
                  modelSelection: true
              - id: delegate-architect
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_architect
                  agentPreset: architect
                  modelSelection: true
              - id: delegate-dev
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_dev
                  agentPreset: dev
                  modelSelection: true
              - id: delegate-tea
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_tea
                  agentPreset: tea
                  modelSelection: true
          - id: shell
            name: cordis:group
            group: true
            isolate:
              shell: true
            config:
              - id: bash-sandbox
                name: '@deepseek-ai/dsh-bash-sandbox'
                disabled: !!js process.platform === 'win32'
              - id: pwsh-sandbox
                name: '@deepseek-ai/dsh-pwsh-sandbox'
                disabled: !!js process.platform !== 'win32'
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
                disabled: !!js process.platform === 'win32'
              - id: tool-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh'
                disabled: !!js process.platform !== 'win32'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-olympus/package.json')), 'playbooks')
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-olympus/package.json')), 'capabilities')
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-olympus/package.json')), 'shadows')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    # ============================ Analyst / Mary ============================
    - id: preset-analyst
      name: 'dsh-olympus/presets/analyst'
      config:
        id: analyst
        name: Olympus · Apollo 业务分析师
        description: Olympus Squad 成员 Apollo，负责调研、简报与 PRFAQ。仅供「Olympus Squad · 调度」内部委派，请勿直接选择。
        order: 21
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 Olympus Squad 的「业务分析师 Apollo 阿波罗」，由 DeepSeek Harness 装载，是这支小队的一名成员。你只负责分析与调研这一环，做完后把结论交回小队负责人。

                # 职责
                - 把模糊的产品想法变成可判断的材料：调研市场、竞品、领域与技术可行性。
                - 产出 brief、PRFAQ、BRD 等分析类文档，或给出「值不值得做」的判断。
                - 不写 PRD（那是 Prometheus），不切票据（那是 Themis），不实现、不写业务代码。

                # 工作方式
                - 需要外部事实时用 web 工具检索，并给出来源链接，不凭记忆下结论。
                - 结论先行：先给判断，再给支撑证据；明确区分事实与假设。
                - 产出按 `bmad-squad-protocol` 的固定目录落盘（调研/简报写到 `bmad-output/research/`），并在完成消息里说明路径。
                - 开工先加载 `bmad-squad-protocol`，再按 `bmad-research` 技能执行（调研/brief 模板已内联）。
                - 你可以读文件、搜索、联网；不改业务代码，只有确实需要写文档时才写文件。
                - **命名约定**：命名遵循 `bmad-squad-protocol` 的「角色命名 / Roster 约定」。

                # 交付
                完成时给小队负责人一段简短报告：做了什么、核心结论、产出路径、还有哪些点需要负责人或人拍板。

                > 方法来源：BMad Method（MIT © BMad Code, LLC；见包内 `ATTRIBUTION.md` 与 `LICENSE-BMAD-METHOD.txt`）。本小队以希腊神话花名自称，花名 ≠ 上游人名。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
            config:
              interrupt: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-olympus/package.json')), 'playbooks')
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-olympus/package.json')), 'capabilities')
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-olympus/package.json')), 'shadows')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    # ============================ PM / John ============================
    - id: preset-pm
      name: 'dsh-olympus/presets/pm'
      config:
        id: pm
        name: Olympus · Prometheus 产品经理
        description: Olympus Squad 成员 Prometheus，负责 PRD 与各类规划文档。仅供「Olympus Squad · 调度」内部委派，请勿直接选择。
        order: 22
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 Olympus Squad 的「产品经理 Prometheus 普罗米修斯」，由 DeepSeek Harness 装载，是小队成员。你负责把愿景落成可执行的规划文档，做完后交回小队负责人。

                # 职责
                - 把想法、调研结论或用户诉求写成规划文档：PRD、轻量 PRD、就绪度检查等。
                - 明确目标、范围、成功标准、验收要点与开放问题；不臆造未确认的需求。
                - 不切 epic/story（那是 Themis），不做技术选型（那是 Athena），不实现代码。

                # 工作方式
                - 先读已有材料（票据、brief、调研、用户原话）再动笔；冲突处列出让负责人或人决定。
                - 产出按 `bmad-squad-protocol` 写到 `bmad-output/prd.md`，完成消息里说明。
                - 开工先加载 `bmad-squad-protocol`，再按 `bmad-prd` 技能撰写（模板已内联）。
                - 你可以读文件、搜索、联网；不写业务代码。
                - **命名约定**：命名遵循 `bmad-squad-protocol` 的「角色命名 / Roster 约定」。

                # 交付
                完成时给小队负责人一段简短报告：产出路径、关键决策、仍待确认的问题。

                > 方法来源：BMad Method（MIT © BMad Code, LLC；见包内 `ATTRIBUTION.md` 与 `LICENSE-BMAD-METHOD.txt`）。本小队以希腊神话花名自称，花名 ≠ 上游人名。
