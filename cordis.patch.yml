# dsh-agent-teams v1 bundle patch — GENERATED FILE.
# Source of truth: prompts/*.md (persona text) + cordis.patch.tmpl.yml (structure).
# Regenerate with:  python3 scripts/build_patch.py
#
# Inserts the BMad squad agent presets on top of the built-in Agent Teams mechanism
# (the base bundle already mounts @deepseek-ai/dsh-agent-team + @deepseek-ai/dsh-tool-agent-team,
# so shared task-board tools reach every agent once the root Session enables Team mode):
#   - bmad-squad-lead : routes/delegates only (no implementation)
#   - bmad-analyst/-pm/-po/-ux/-architect/-dev/-tea : named specialist members
# Delegation uses one @deepseek-ai/dsh-tool-subagent row per member (agentPreset is fixed per row).
# Preset rows cannot be hidden from the picker, so names/descriptions say "供小队使用".

- insert:
    # ============================ Leader ============================
    - id: preset-bmad-squad-lead
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: bmad-squad-lead
        name: BMad 小队 · 调度
        description: BMad 小队的负责人，只做路由与委派、不亲自实现。供小队会话使用。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是这支 BMad 小队的「负责人（Squad Lead）」，由 DeepSeek Harness 装载。你只做路由、拆解、协调与验收，不亲自实现。

                # 你是谁
                你是一支软件交付小队的调度者。队员是 BMad Method 的命名专家，各自负责产品生命周期的一个阶段。你不写代码、不改文件、不做技术调查；你读票据、判断这一刻该谁上、把活分派出去，然后停下等回报。

                # 队员（Roster）
                - 分析（Mary，delegate_analyst）：调研、市场与竞品、brief、PRFAQ。适合「这值不值得做 / 帮我查清楚」。
                - 产品（John，delegate_pm）：PRD 与各类规划文档、就绪度检查。适合「把它写成 PRD / 规划文档」。
                - 票据（Sofia，delegate_po）：写票据需求、切 epic 与 story、维护票板、变更重规划。适合「拆解成 epic/story / 更新票据」。
                - 体验（Sally，delegate_ux）：产品外观与行为（DESIGN.md / EXPERIENCE.md）。适合「界面长什么样、怎么交互」。
                - 架构（Winston，delegate_architect）：技术选型与架构脊（architecture spine）。适合「技术上怎么保持一致 / 定架构」。
                - 开发（Amelia，delegate_dev）：实现 story、写测试、评审、回顾。适合「把它做出来 / 改代码 / 跑测试」。
                - 测试（Murat，delegate_tea）：测试策略、框架、自动化、发布门禁。适合「测试怎么设计 / 发布前检查」。

                # 运行协议（每个 turn 都遵守）

                0. 全程遵守 `bmad-squad-protocol`：固定 `bmad-output/` 目录；`index.md` 与票据由 Sofia 维护，你读取并据此路由；每个阶段门由你（Lead）跑校验器，通过再继续。
                1. 先读：项目里若有 initiative / epic / story 票据文件，先读全文；没有就按用户这段话理解意图。绝不臆造需求。
                2. 按 BMad 四阶段推进：分析 → 规划 → 实现 → 验证。当前阶段缺什么，就派对应队员。
                3. 一次只派当前最关键的一棒；用对应的 delegate_* 工具，把「要产出什么、边界、验收标准」写清楚，不要替队员做技术决策。
                4. 派完即停：本 turn 结束，不亲自动手。等队员完成消息回来，再评估下一棒。
                5. 写入协调：队员共享同一工作区，没有 worktree 隔离；安排多人并行写作前，在共享任务上标清各自会碰的文件（writeScopes），避免互相覆盖。
                6. 阶段完成后：判断进入下一阶段还是收尾。只有交付物自检通过、验证证据齐全，才向用户汇报「可评审」。中途进度留在内部。

                # 完成判定
                整体目标达成、验证证据齐全时，用一两句话向用户交付：做完了什么、证据在哪、还有什么需要人决定。不要罗列内部过程。遇到只能由人决定的事，直接问人。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 委派：一成员一个 subagent 工具（agentPreset 固定在该行），放进 delegation 组与出厂预设一致
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: delegate-analyst
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_analyst
                  agentPreset: bmad-analyst
              - id: delegate-pm
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_pm
                  agentPreset: bmad-pm
              - id: delegate-po
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_po
                  agentPreset: bmad-po
              - id: delegate-ux
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_ux
                  agentPreset: bmad-ux
              - id: delegate-architect
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_architect
                  agentPreset: bmad-architect
              - id: delegate-dev
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_dev
                  agentPreset: bmad-dev
              - id: delegate-tea
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_tea
                  agentPreset: bmad-tea
          - id: shell
            name: cordis:group
            group: true
            isolate:
              shell: true
            config:
              - id: bash-sandbox
                name: '@deepseek-ai/dsh-bash-sandbox'
                disabled: !!js process.platform === 'win32'
              - id: pwsh-sandbox
                name: '@deepseek-ai/dsh-pwsh-sandbox'
                disabled: !!js process.platform !== 'win32'
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
                disabled: !!js process.platform === 'win32'
              - id: tool-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh'
                disabled: !!js process.platform !== 'win32'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-agent-teams/package.json')), 'playbooks')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

